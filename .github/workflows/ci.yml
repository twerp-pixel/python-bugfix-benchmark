name: Benchmark CI & Automated Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Grading Harness
        run: |
          python -m harness.runner --mode fixed --json-out benchmark_results.json --signoff-out REVIEWER_SIGNOFF.md

      - name: Upload Reviewer & Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evaluation-reports
          path: |
            benchmark_results.json
            REVIEWER_SIGNOFF.md
